name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_chrome:
        description: >-
          Run the opt-in live managed-Chrome tests (requires a runner with
          Google Chrome installed; windows-latest has it preinstalled).
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Format, lint, build, test, and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (mocks feature)
        run: cargo clippy --all-targets --features mocks -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      - name: Test (mock providers)
        run: cargo test --features mocks

      - name: Evaluation suite (fixture-backed scenarios)
        run: cargo test --features mocks --test eval

      - name: Release build
        run: cargo build --release

      - name: Stage the native binary into the npm package
        run: powershell -ExecutionPolicy Bypass -File npm/scripts/copy-native.ps1

      - name: Node launcher and package validation
        run: node --test npm/test/launcher.test.js npm/test/package.test.js

      - name: npm pack dry-run (launcher package)
        run: npm.cmd pack --dry-run --json
        working-directory: npm/mcp

      - name: npm pack dry-run (native package)
        run: npm.cmd pack --dry-run --json
        working-directory: npm/win32-x64-msvc

      - name: Secret scan over the packaging tree
        shell: pwsh
        run: |
          $patterns = @(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----',
            'ghp_[A-Za-z0-9]{20,}',
            'sk-[A-Za-z0-9]{20,}',
            'glpat-[A-Za-z0-9_-]{16,}',
            'AKIA[0-9A-Z]{16}',
            '(password|passwd|secret|token)\s*=\s*[^\s"''']{6,}'
          )
          $hits = @()
          Get-ChildItem -Recurse -File -Path npm | Where-Object { $_.Extension -ne '.exe' } | ForEach-Object {
            $text = Get-Content -Raw -ErrorAction SilentlyContinue $_.FullName
            if (-not $text) { return }
            foreach ($p in $patterns) {
              if ($text -match $p) { $hits += $_.FullName }
            }
          }
          if ($hits.Count -gt 0) {
            $hits | Sort-Object -Unique | ForEach-Object { Write-Error "secret pattern match in: $_" }
            exit 1
          }
          Write-Host "Secret scan clean."

      - name: Packed-package smoke test (isolated install of real tarballs)
        run: powershell -ExecutionPolicy Bypass -File npm/scripts/test-packed.ps1

  # Opt-in live managed-Chrome verification. Never runs on pull requests;
  # only on an explicit workflow_dispatch with run_live_chrome set. Windows
  # runners have Google Chrome preinstalled, so this exercises the real
  # binary path: location without download, owned profile, loopback-only
  # DevTools, page summary, bounded screenshot, unexpected-exit cleanup
  # (owned tree reaped, owned profile removed), later-session startup,
  # graceful stop, unrelated-Chrome safety, and the standalone config
  # harness. The headless lifecycle test runs unconditionally here; the
  # headed lifecycle test requires an interactive desktop — on a
  # non-interactive runner (session 0) it skips itself with an explicit
  # environment-limitation reason and headed behavior is marked UNVERIFIED
  # (a skip is never a pass), so the job reports the limitation instead of
  # pretending headed mode passed. Each mode must pass at least ten
  # consecutive isolated runs on an interactive desktop before any
  # release-ready claim (Chrome can expose DevTools moments before an
  # intermittent GPU-process crash takes it down; a single failed run means
  # the mode is still unreliable).
  live-chrome:
    name: Live managed Chrome (opt-in)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_live_chrome == 'true'
    runs-on: windows-latest
    env:
      WINKIT_LIVE_CHROME: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run live headless managed-Chrome lifecycle test
        run: cargo test --features live-chrome --lib live_managed_chrome_headless_start_inspect_stop -- --nocapture

      - name: Run live headed managed-Chrome lifecycle test (skips without an interactive desktop)
        run: cargo test --features live-chrome --lib live_managed_chrome_headed_start_inspect_stop -- --nocapture

      - name: Run the standalone headless-config diagnostic harness
        run: cargo test --features live-chrome --lib live_headless_mode_diagnostic_harness -- --nocapture

      - name: Verify no WinKit-owned Chrome processes remain
        shell: pwsh
        run: |
          $owned = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'chrome.exe' -and ($_.CommandLine -match 'winkit-managed-test' -or $_.CommandLine -match 'session-wk-') }
          if ($owned.Count -gt 0) { Write-Error "$($owned.Count) WinKit-owned Chrome process(es) remain after the live test"; exit 1 }
          Write-Host "No WinKit-owned Chrome processes remain."
