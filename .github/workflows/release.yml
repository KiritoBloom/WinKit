name: Release

# Fully automatic releases on version tags:
#
#   Pushing a v* tag builds both architectures, validates everything, and
#     publishes all three npm packages. No manual step.
#
#   A manual dispatch with publish=true also publishes (for re-releases);
#   a manual dispatch without it only builds and validates.
#
# Version numbers must be bumped before tagging: npm rejects duplicate
# versions, so each tag must carry new Cargo.toml / npm/*/package.json
# versions (keep them all in sync).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm after building'
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Test (mock providers, host target)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --features mocks

      - name: Release build (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage the native binary into its npm package
        run: >
          powershell -ExecutionPolicy Bypass -File npm/scripts/copy-native.ps1
          -Arch ${{ matrix.arch }} -Target ${{ matrix.target }}

      - name: Node launcher and package validation
        run: node --test npm/test/launcher.test.js npm/test/package.test.js

      - name: npm pack dry-run (launcher package)
        run: npm.cmd pack --dry-run --json
        working-directory: npm/mcp

      - name: npm pack dry-run (native package)
        run: npm.cmd pack --dry-run --json
        working-directory: npm/win32-${{ matrix.arch }}-msvc

      - name: Secret scan over the packaging tree
        shell: pwsh
        run: |
          $patterns = @(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----',
            'ghp_[A-Za-z0-9]{20,}',
            'sk-[A-Za-z0-9]{20,}',
            'glpat-[A-Za-z0-9_-]{16,}',
            'AKIA[0-9A-Z]{16}',
            '(password|passwd|secret|token)\s*=\s*[^\s"'']{6,}'
          )
          $hits = @()
          Get-ChildItem -Recurse -File -Path npm | Where-Object { $_.Extension -ne '.exe' } | ForEach-Object {
            $path = $_.FullName
            Get-Content -ErrorAction SilentlyContinue $_.FullName | ForEach-Object {
              foreach ($p in $patterns) {
                if ($_ -match $p) {
                  # Redact the matched span; show enough context to diagnose.
                  $snippet = $_.Trim() -replace '(ghp_\S{6})\S+', '$1...' -replace '(sk-\S{4})\S+', '$1...'
                  if ($snippet.Length -gt 160) { $snippet = $snippet.Substring(0, 160) + '...' }
                  $hits += "$path :: pattern [$p] :: line: $snippet"
                }
              }
            }
          }
          if ($hits.Count -gt 0) {
            # Print every hit with file and pattern so the failure is
            # diagnosable straight from the CI log. Matched spans inside the
            # snippet are redacted above; never publish on a hit.
            $hits | Sort-Object -Unique | ForEach-Object { Write-Host "::error::secret pattern match: $_" }
            exit 1
          }
          Write-Host "Secret scan clean."

      - name: Packed-package smoke test (host architecture only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: powershell -ExecutionPolicy Bypass -File npm/scripts/test-packed.ps1

      - name: Upload native package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-win32-${{ matrix.arch }}-msvc
          path: |
            npm/mcp/bin/**
            npm/win32-${{ matrix.arch }}-msvc/**

  publish:
    name: Publish npm packages
    needs: build
    runs-on: windows-latest
    # Automatic on a version tag; also reachable via a hand-triggered
    # dispatch with publish=true (useful for re-releasing without retagging).
    if: github.event_name == 'push' || inputs.publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Download staged packages
        uses: actions/download-artifact@v4
        with:
          pattern: npm-win32-*-msvc
          merge-multiple: true
          path: .

      - name: Publish native packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Native packages first so the launcher's optionalDependencies are
          # resolvable the moment @winkit/mcp hits the registry.
          foreach ($pkg in @('npm\win32-x64-msvc', 'npm\win32-arm64-msvc')) {
            Push-Location $pkg
            npm.cmd publish --access public
            Pop-Location
          }
          Push-Location npm\mcp
          npm.cmd publish --access public
          Pop-Location
